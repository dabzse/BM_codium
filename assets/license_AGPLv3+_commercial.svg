<svg xmlns="http://www.w3.org/2000/svg" width="190" height="20" role="img"
    aria-label="License: AGPLv3+ | Commercial">
    <title>License: AGPLv3+ | Commercial</title>
    <filter id="blur">
        <feGaussianBlur stdDeviation="16" />
    </filter>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1" />
        <stop offset="1" stop-opacity=".1" />
    </linearGradient>
    <clipPath id="r">
        <rect width="190" height="20" rx="3" />
    </clipPath>
    <g clip-path="url(#r)">
        <rect width="51" height="20" fill="#555" />
        <rect x="51" width="139" height="20" fill="#2980b9" />
        <rect width="190" height="20" fill="url(#s)" />
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif"
        text-rendering="geometricPrecision" font-size="110">
        <g transform="scale(.1)">
            <g aria-hidden="true" fill="#010101">
                <text x="265" y="150" fill-opacity=".8" filter="url(#blur)" textLength="410">License</text>
                <text x="265" y="150" fill-opacity=".3" textLength="410">License</text>
            </g>
            <text x="265" y="140" textLength="410">License</text>
        </g>
        <g transform="scale(.1)">
            <g aria-hidden="true" fill="#010101">
                <text x="1195" y="150" fill-opacity=".8" filter="url(#blur)" textLength="1290">AGPLv3+
                    | Commercial</text>
                <text x="1195" y="150" fill-opacity=".3" textLength="1290">AGPLv3+ | Commercial</text>
            </g>
            <text x="1195" y="140" textLength="1290">AGPLv3+ | Commercial</text>
        </g>
    </g>
</svg>