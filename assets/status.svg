        <rect x="52" width="68" height="20" fill="#e05d44" />
        <rect width="120" height="20" fill="url(#s)" />
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif"
        text-rendering="geometricPrecision" font-size="110">
        <text x="270" y="140" transform="scale(.1)" textLength="420">Status</text>
        <text x="850" y="140" transform="scale(.1)" textLength="580">Pre-Canary-0</text>
