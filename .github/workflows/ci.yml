name: CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.0-pre-canary-0; if empty, uses version from Cargo.toml)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check-and-test:
    name: Check & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # vendor-offline is gitignored and used for local offline development.
      # When running in CI without vendor-offline present, remove local vendor config so Cargo fetches online.
      - name: Prepare Cargo config for CI
        shell: bash
        run: |
          if [ ! -d "vendor-offline" ]; then
            echo "vendor-offline directory not found; disabling local offline vendoring configuration for CI."
            rm -f .cargo/config.toml
          fi

      - name: Install system dependencies for GUI (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libasound2-dev \
            xz-utils

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Extract Codium version from Cargo.toml
        shell: bash
        run: |
          VERSION=$(python3 -c "import pathlib; [print(line.split('=')[1].strip(' \t\n\"\'')) for line in pathlib.Path('Cargo.toml').read_text().splitlines() if line.strip().startswith('version =')]")
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m 1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "Detected version: ${VERSION}"
          echo "CODIUM_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run unit & integration tests
        run: cargo test --workspace

      - name: Build binaries (Release)
        run: cargo build --release --workspace --bin edu-codium --bin ai-codium

      # -------------------------------------------------------------
      # Linux Packaging (.tar.xz)
      # -------------------------------------------------------------
      - name: Package Linux release bundle (.tar.xz)
        if: runner.os == 'Linux'
        run: |
          BUNDLE_NAME="codium-v${{ env.CODIUM_VERSION }}-linux-x64"
          mkdir -p "staging/${BUNDLE_NAME}"
          cp target/release/edu-codium "staging/${BUNDLE_NAME}/"
          cp target/release/ai-codium "staging/${BUNDLE_NAME}/"
          chmod +x "staging/${BUNDLE_NAME}/edu-codium" "staging/${BUNDLE_NAME}/ai-codium"
          cp -r resources "staging/${BUNDLE_NAME}/"
          cp -r locales "staging/${BUNDLE_NAME}/"
          cp -r settings "staging/${BUNDLE_NAME}/"
          cp README.md "staging/${BUNDLE_NAME}/"
          tar -cJf "${BUNDLE_NAME}.tar.xz" -C staging "${BUNDLE_NAME}"

      - name: Upload Linux bundle (.tar.xz)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: codium-v${{ env.CODIUM_VERSION }}-linux-x64
          path: codium-v${{ env.CODIUM_VERSION }}-linux-x64.tar.xz

      # -------------------------------------------------------------
      # Windows Packaging (.zip)
      # -------------------------------------------------------------
      - name: Package Windows release bundle (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ env.CODIUM_VERSION }}"
          $bundleName = "codium-v${ver}-windows-x64"
          New-Item -ItemType Directory -Force -Path "staging/$bundleName"
          Copy-Item target/release/edu-codium.exe "staging/$bundleName/"
          Copy-Item target/release/ai-codium.exe "staging/$bundleName/"
          Copy-Item -Recurse resources "staging/$bundleName/"
          Copy-Item -Recurse locales "staging/$bundleName/"
          Copy-Item -Recurse settings "staging/$bundleName/"
          Copy-Item README.md "staging/$bundleName/"
          Compress-Archive -Path "staging/$bundleName" -DestinationPath "${bundleName}.zip"

      - name: Upload Windows bundle (.zip)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: codium-v${{ env.CODIUM_VERSION }}-windows-x64
          path: codium-v${{ env.CODIUM_VERSION }}-windows-x64.zip

  # -------------------------------------------------------------
  # Automatic Release & Tag Creation
  # -------------------------------------------------------------
  release:
    name: Publish Release & Update Tag
    needs: check-and-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          PROJ_VERSION=$(python3 -c "import pathlib; [print(line.split('=')[1].strip(' \t\n\"\'')) for line in pathlib.Path('Cargo.toml').read_text().splitlines() if line.strip().startswith('version =')]")
          if [ -z "$PROJ_VERSION" ]; then
            PROJ_VERSION=$(grep -m 1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          if [ -z "$PROJ_VERSION" ]; then
            PROJ_VERSION="0.0.0"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            NAME="BM Codium ${TAG}"
            PRERELEASE="false"
            PUSH_TAG="true"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            NAME="BM Codium ${TAG}"
            PRERELEASE="false"
            PUSH_TAG="false"
          else
            TAG="v${PROJ_VERSION}"
            NAME="BM Codium v${PROJ_VERSION}"
            PRERELEASE="false"
            PUSH_TAG="true"
          fi

          if echo "$TAG" | grep -qiE 'pre|canary|alpha|beta|rc|dev'; then
            PRERELEASE="true"
          fi

          echo "Detected project version: ${PROJ_VERSION}"
          echo "Target tag: ${TAG}"
          echo "Release name: ${NAME}"
          echo "Is prerelease: ${PRERELEASE}"
          echo "Push tag: ${PUSH_TAG}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "push_tag=${PUSH_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog & Release Notes
        id: changelog
        shell: bash
        run: |
          TARGET_TAG="${{ steps.meta.outputs.tag }}"

          # Find the previous release tag if available
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | grep -v "^${TARGET_TAG}$" | head -n 1 || true)
          echo "Previous release tag: ${PREV_TAG}"

          echo "## 🚀 What's Changed in ${TARGET_TAG}" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "### 📝 Changes since **${PREV_TAG}**:" >> release_notes.md
            git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - @%an" >> release_notes.md
          else
            echo "### 📝 Recent Commits:" >> release_notes.md
            git log -n 25 --no-merges --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - @%an" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TARGET_TAG}" >> release_notes.md
          else
            echo "**Full Commit History**: https://github.com/${{ github.repository }}/commits/${TARGET_TAG}" >> release_notes.md
          fi

      - name: Update release tag pointer
        if: steps.meta.outputs.push_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.meta.outputs.tag }}" "${{ github.sha }}"
          git push -f origin "refs/tags/${{ steps.meta.outputs.tag }}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body_path: release_notes.md
          generate_release_notes: true
          overwrite_files: true
          files: release-assets/*
